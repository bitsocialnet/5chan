apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Keep in sync with scripts/sync-android-release.mjs.
def versionNameToCode(String versionName) {
    def stableVersion = versionName.replaceFirst(/^v/, "").split("-")[0]
    def parts = stableVersion.tokenize(".").collect { part -> part.isInteger() ? part.toInteger() : 0 }

    while (parts.size() < 3) {
        parts.add(0)
    }

    return (parts[0] * 10000) + (parts[1] * 100) + parts[2]
}

android {
    namespace "fivechan.android"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fivechan.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // F-Droid's update checker only reads literal values from tagged sources.
        // Release prep rewrites both lines from package.json with scripts/sync-android-release.mjs.
        versionCode 1004
        versionName "0.10.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "distribution"
    productFlavors {
        github {
            dimension "distribution"
        }
        fdroid {
            dimension "distribution"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def packageVersionName = new JsonSlurper().parse(file("../../package.json")).version.toString()
def packageVersionCode = versionNameToCode(packageVersionName)
if (android.defaultConfig.versionName != packageVersionName || android.defaultConfig.versionCode != packageVersionCode) {
    throw new GradleException(
        "android/app/build.gradle declares ${android.defaultConfig.versionName} (${android.defaultConfig.versionCode}) " +
        "but package.json is ${packageVersionName} (${packageVersionCode}). Run: node scripts/sync-android-release.mjs"
    )
}

repositories {
    google()
    mavenCentral()
    maven { url "https://maven.google.com" }
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation "org.apache.cordova:framework:$cordovaAndroidVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
