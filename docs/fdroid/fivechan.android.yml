Builds:
  - versionName: 0.10.3
    versionCode: 1003
    commit: c051be8c97acd444c766551cdcb061594c864c0c
    subdir: android
    sudo:
      - curl -Lo node.tar.xz https://nodejs.org/dist/v22.22.3/node-v22.22.3-linux-x64.tar.xz
      - echo "2e5d13569282d016861fae7c8f935e741693c269101a5bebcf761a5376d1f99f  node.tar.xz"
        | sha256sum -c -
      - tar xf node.tar.xz --strip-components=1 -C /usr/local/
      - corepack enable
    gradle:
      - fdroid
    rm:
      - android/bitsocial.keystore
    prebuild:
      - cd ..
      - ELECTRON_SKIP_BINARY_DOWNLOAD=1 corepack yarn install --immutable
    scandelete:
      - node_modules
    build:
      - cd ..
      - corepack yarn build:fdroid
      - corepack yarn cap sync android

